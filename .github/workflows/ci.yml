name: Validate demo project
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  database-and-permissions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: npm install --no-save --prefix /tmp/fleet-test @electric-sql/pglite@0.5.13
      - run: python scripts/check_publication.py
      - run: python -m compileall -q app scripts
      - run: python scripts/build_dashboard.py && git diff --exit-code -- grafana/dashboards/fleet.json
      - run: python tests/test_project.py
        env:
          PGLITE_MODULE: /tmp/fleet-test/node_modules/@electric-sql/pglite/dist/index.js
  compose-and-grafana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/setup_env.py
      - run: docker compose config --quiet
      - run: docker compose up -d --build web grafana
      - run: python scripts/smoke.py
      - if: failure()
        run: docker compose logs --no-color --tail 80 web grafana init
      - if: always()
        run: docker compose down -v
