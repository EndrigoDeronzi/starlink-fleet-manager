apiVersion: 1
prune: true
datasources:
  - name: Fleet PostgreSQL
    uid: fleet-postgres
    type: postgres
    access: proxy
    url: db:5432
    user: $GRAFANA_DB_USER
    isDefault: true
    editable: false
    jsonData:
      database: $GRAFANA_DB_NAME
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      timeInterval: 1m
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
