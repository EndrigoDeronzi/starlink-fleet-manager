<h1>Obras e regionais</h1>{% if company_current %}<section class="panel"><form method="post" class="grid"><input type="hidden" name="csrf" value="{{session.csrf}}"><input type="hidden" name="action" value="create"><label>Nome da obra/regional<input name="name" required maxlength="150"></label><button>Cadastrar em {{company_current.name}}</button></form></section>{% endif %}
<section class="panel">{% for r in rows %}<section class="panel"><p>{{r.company_name}} · {{r.name}}</p>{% if company_current %}<form method="post" class="grid"><input type="hidden" name="csrf" value="{{session.csrf}}"><input type="hidden" name="action" value="update"><input type="hidden" name="id" value="{{r.id}}"><label>Nome<input name="name" value="{{r.name}}" required maxlength="150"></label><button>Salvar alterações</button></form><form method="post" onsubmit="return confirm('Excluir unidade sem antenas vinculadas?')"><input type="hidden" name="csrf" value="{{session.csrf}}"><input type="hidden" name="action" value="delete"><input type="hidden" name="id" value="{{r.id}}"><button style="background:var(--danger);width:auto">Excluir unidade</button></form>{% endif %}</section>{% else %}<p>Nenhuma obra/regional nesta seleção.</p>{% endfor %}</section>
